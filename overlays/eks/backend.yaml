apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquizto-backend-deployemnt
  annotations:
    mosquizto.io/environment: eks-lab
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mosquizto-backend
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mosquizto-config
            - configMapRef:
                name: mosquizto-model-config
          startupProbe:
            httpGet: {path: /v3/api-docs, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /v3/api-docs, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
