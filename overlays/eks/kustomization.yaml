apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mosquizto-eks
resources:
  - ../../base
  - ../../dependencies
  - model-config.yaml
patches:
  - path: backend.yaml
  - path: config.yaml
  - path: public-service.yaml
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: mosquizto-gp3
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
images:
  - name: mosquizto-backend
    newName: 821278618825.dkr.ecr.us-east-1.amazonaws.com/mosquizto-backend
    digest: sha256:9878dcf990a36039f3cd3b1c6e8948f3b6b7a311e58f91ab4890a73ae5903dd6
