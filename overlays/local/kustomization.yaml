apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mosquizto-local
resources:
  - ../../base
  - namespace.yaml
  - ../../dependencies
secretGenerator:
  - name: mosquizto-secret
    envs:
      - .runtime.secret.env
patches:
  - path: image.yaml
  - path: mosquizto-config.yaml
