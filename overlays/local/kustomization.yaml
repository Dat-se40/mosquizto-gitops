apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mosquizto-local
resources:
  - ../../base
  - namespace.yaml
  - redis.yaml
  - meilisearch.yaml
  - qdrant.yaml
secretGenerator:
  - name: mosquizto-secret
    behavior: merge
    envs:
      - .local.secret.env
patches:
  - path: image.yaml
  - path: mosquizto-config.yaml
