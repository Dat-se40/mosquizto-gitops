# Operation template only. Never include in the workload/Argo CD kustomization.
apiVersion: batch/v1
kind: Job
metadata:
  name: mosquizto-prepare-model-template
  namespace: mosquizto-local
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: mosquizto-prepare-model
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: prepare-model
          image: mosquizto-backend:local-sync-002
          imagePullPolicy: Never
          args: ["--prepare-model"]
          envFrom:
            - configMapRef:
                name: mosquizto-model-config
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mosquizto-models
