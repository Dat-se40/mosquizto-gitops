apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../eks-review
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: mosquizto-eks
    patch: |-
      - op: add
        path: /spec/syncPolicy/automated
        value:
          prune: false
          selfHeal: true
          allowEmpty: false
